name: Inspect native portable test failure
on:
  push:
    branches: [diagnostics-v14]
    paths: [.github/workflows/diagnose-v14.yml]
permissions:
  actions: read
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read failed packaged step from authorized repository logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --allow-escape-sequences repos/${{ github.repository }}/actions/jobs/119148115989/logs > /tmp/native-job.txt 2> /tmp/diagnostic-error.txt || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('/tmp/native-job.txt').read_bytes().decode('utf-8',errors='replace')
          text=re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text)
          start=text.find('##[group]Run node test/portable.e2e.js')
          if start<0: text=Path('/tmp/diagnostic-error.txt').read_text()+'\n'+text; start=0
          stop=text.find('##[group]Run actions/upload-artifact',start+10)
          result=text[start:stop if stop>=0 else None][-18000:]
          target=Path('validation/diagnostics/1.4.0-portable-failure.txt')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(result)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/diagnostics/1.4.0-portable-failure.txt
          git commit -m 'Record packaged-test failure trace [skip ci]'
          git push origin HEAD:diagnostics-v14
