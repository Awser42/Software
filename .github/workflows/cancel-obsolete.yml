name: Stop superseded price build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cancel-obsolete.yml']
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Cancel superseded validation before release
        run: gh api --method POST "repos/$GH_REPO/actions/runs/39560657547/cancel"
