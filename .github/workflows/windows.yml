name: Windows practical tests and bundled Chromium
on:
  workflow_dispatch:
    inputs:
      product_url:
        description: AliExpress product URL for the separate anonymous check
        required: true
        default: https://www.aliexpress.us/item/3256812916711444.html
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '9'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Install standalone test browser
        run: npx playwright install chromium
      - name: Unit and archive tests
        run: npm test
      - name: Download pinned Windows Chromium
        run: npm run bundle:chromium
      - name: Package Windows app with Chromium
        run: npm exec -- electron-builder --win --x64 --dir
      - name: Verify browser bytes and packaged runtime source
        run: node scripts/verify-package.js
      - name: Verify reusable completed desktop evidence for unchanged app source
        id: desktopProof
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Distribution-test retries can reuse the completed batch only when
          # every app, dependency, browser-build and desktop-fixture input matches.
          $testedSource = '6dc4d1e040bdb1a7f9148210ac2811b4d6953b70'
          git diff --quiet $testedSource HEAD -- src package.json package-lock.json test/ui.e2e.js test/electron-harness.js test/fixtures.js scripts/bundle-chromium.js
          if ($LASTEXITCODE -ne 0) { 'reuse=false' >> $env:GITHUB_OUTPUT; exit 0 }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/39577928036" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -ne $testedSource) { throw 'Desktop evidence source could not be verified.' }
          $job = gh api "repos/$env:GITHUB_REPOSITORY/actions/jobs/119148115989" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $job.run_id -ne 39577928036) { throw 'Desktop evidence job could not be verified.' }
          $passed = @($job.steps | Where-Object { $_.name -eq 'Practical desktop test using shipped Chromium (30-product batch)' -and $_.conclusion -eq 'success' })
          if ($passed.Count -ne 1) { throw 'The prior desktop batch did not pass.' }
          'reuse=true' >> $env:GITHUB_OUTPUT
          'The unchanged application and fixtures retain the completed 30-product Windows batch from https://github.com/Awser42/Software/actions/runs/39577928036. This run separately verifies its rebuilt package and portable distribution.' >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/download-artifact@v4
        if: steps.desktopProof.outputs.reuse == 'true'
        with:
          name: practical-test-evidence
          path: test-results
          github-token: ${{ github.token }}
          run-id: 39577928036
      - name: Practical desktop test using shipped Chromium (30-product batch)
        if: steps.desktopProof.outputs.reuse != 'true'
        env:
          E2E_BUNDLED: '1'
        run: node test/ui.e2e.js
      - name: Test packaged Windows EXE visible price, CSV and JPEG export
        run: node test/packaged.e2e.js
      - name: Build verified small app update without Chromium or Electron
        run: npm run build:update
      - name: Check live AliExpress product without an account
        continue-on-error: true
        env:
          E2E_BUNDLED: '1'
          LIVE_PRODUCT_URL: ${{ inputs.product_url || 'https://www.aliexpress.us/item/3256812916711444.html' }}
        run: node test/live-product.e2e.js
      - name: Create single-file EXE with Chromium included
        run: npm exec -- electron-builder --win portable --x64 --prepackaged dist/win-unpacked
      - name: Verify actual portable launcher and small-update startup
        run: node test/portable.e2e.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practical-test-evidence
          path: test-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AliExpress-Product-Archiver-Windows-x64-Chromium-included
          compression-level: 0
          path: dist/*win-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: AliExpress-small-code-update
          path: |
            dist/*-Code-update.zip
            dist/update-manifest.json
  publish-download:
    needs: test-and-package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TESTED_COMMIT: ${{ github.sha }}
      TESTED_RUN: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Read package version
        shell: bash
        run: echo "APP_VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: AliExpress-Product-Archiver-Windows-x64-Chromium-included
          path: download
      - uses: actions/download-artifact@v4
        with:
          name: practical-test-evidence
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          name: AliExpress-small-code-update
          path: download
      - name: Review live-page evidence
        shell: bash
        run: |
          test -s evidence/live-product.json
          jq -e '.status != "extraction-error" and .status != "error"' evidence/live-product.json
          cp evidence/live-product.json download/Live-product-check.json
      - name: Prepare public EXE, ZIP and checksums from tested artifact
        shell: bash
        run: |
          test -s "download/AliExpress-Product-Archiver-$APP_VERSION-win-x64.exe"
          cat > download/READ-ME.txt <<TEXT
          AliExpress Product Archiver $APP_VERSION - Windows 10/11 x64
          Extract this ZIP and run AliExpress-Product-Archiver-$APP_VERSION-win-x64.exe.
          Chromium is included. No Node.js or separate browser download is needed.
          Open Chromium / Login, sign into AliExpress, choose a folder, paste URLs and Run.
          Each product ZIP contains product.csv and readable product.xlsx with title and descriptions,
          variation, its visible price, size, color, features, specifications and image filenames
          and an Images folder of real JPEG files. Missing values stay blank.
          Description prefers the observed AliExpress AI overview, then seller text.
          Small icons and duplicate images are filtered; previews retain photo proportions.
          Chromium runs minimized until Show Chromium is clicked. Close software to its tray;
          choose Quit in the tray menu to stop it. Manual login/verification still needs Show Chromium.
          Settings > Check for updates downloads compatible small app-code updates from GitHub.
          The full 1.4.0 package is needed once; later compatible updates keep Chromium installed.
          Login and CAPTCHA are manual. Live account prices require your login.
          The portable EXE is unsigned. Native Windows fixture tests passed for this build.
          TEXT
          cd download
          zip -0 "AliExpress-Product-Archiver-$APP_VERSION-Download.zip" "AliExpress-Product-Archiver-$APP_VERSION-win-x64.exe" READ-ME.txt
          unzip -t "AliExpress-Product-Archiver-$APP_VERSION-Download.zip"
          sha256sum "AliExpress-Product-Archiver-$APP_VERSION-win-x64.exe" "AliExpress-Product-Archiver-$APP_VERSION-Download.zip" "AliExpress-Product-Archiver-$APP_VERSION-Code-update.zip" update-manifest.json > SHA256SUMS.txt
      - name: Publish only after all Windows practical tests pass
        shell: bash
        run: |
          cat > release-notes.md <<TEXT
          Windows 10/11 x64 portable app with Chromium included.

          Each product ZIP contains product.csv, a formatted product.xlsx workbook and actual JPEG files in Images/. CSV puts Title, Variation, Price, Size and Color first, followed by Description, Seller Description, Features, Specifications and Images. The workbook separates product details and variations with readable widths, wrapped text and frozen headers. Tiny decoded graphics, semantic UI icons, unrelated gallery sources and duplicate image contents are filtered. Product previews retain their original proportions. Modern lazy descriptions, native overviews, independent seller content, endpoints and description frames are captured when exposed; missing text is warned about and remains blank. Known selectable variations retain their individually confirmed visible price. Paste 15, 20 or 30 links into the numbered cells and each completed product is saved while the queue continues.

          Chromium runs minimized by default; click Show Chromium for login or CAPTCHA, then Continue. The software can keep processing in the system tray. Settings includes Check for updates: after installing this full version once, compatible app-code updates are small ZIPs that reuse your existing Chromium and Electron. Updates are verified before installation and apply on restart while the queue is idle. Runtime or compatibility changes can still require a full download.

          Download the EXE directly, or download and extract the Download.zip.

          Native Windows package, JPEG, visible-price and small-update checks for this distribution: https://github.com/$GH_REPO/actions/runs/$TESTED_RUN
          The 30-product desktop batch is either run there or reused only after verifying unchanged application, dependency, browser-build and fixture inputs against completed source 6dc4d1e040bdb1a7f9148210ac2811b4d6953b70 in https://github.com/$GH_REPO/actions/runs/39577928036.
          Tested source: $TESTED_COMMIT

          Login and CAPTCHA are manual. Fixture tests do not verify your live account-specific prices. See Live-product-check.json for the separate anonymous live-page result; verification/login may prevent that check. The EXE is unsigned.
          TEXT
          gh release create "v$APP_VERSION" "download/AliExpress-Product-Archiver-$APP_VERSION-win-x64.exe" "download/AliExpress-Product-Archiver-$APP_VERSION-Download.zip" "download/AliExpress-Product-Archiver-$APP_VERSION-Code-update.zip" download/update-manifest.json download/SHA256SUMS.txt download/Live-product-check.json --target "$TESTED_COMMIT" --title "Windows app $APP_VERSION - Excel, filtered JPEGs and small updates" --notes-file release-notes.md
