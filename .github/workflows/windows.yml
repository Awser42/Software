name: Windows practical tests and bundled Chromium
on:
  workflow_dispatch:
    inputs:
      product_url:
        description: AliExpress product URL for the separate anonymous check
        required: true
        default: https://www.aliexpress.us/item/3256812932267795.html
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '9'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Install standalone test browser
        run: npx playwright install chromium
      - name: Unit and Excel archive tests
        run: npm test
      - name: Verify reusable source-matched Windows batch and Setup evidence
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = 'd8dd9e2020269b9e79187e5a8eae919d575f2f6d'
          # The installed EXE runs test/packaged.e2e.js again below, including its navigation timeout correction.
          git diff --quiet $source HEAD -- src package.json package-lock.json scripts/bundle-chromium.js scripts/build-update.js test/ui.e2e.js test/electron-harness.js test/fixtures.js test/workbook.js
          if ($LASTEXITCODE -ne 0) { 'reuse=false' >> $env:GITHUB_OUTPUT; exit 0 }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/39703299290" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -ne $source) { throw 'Source-matched run could not be verified.' }
          $job = gh api "repos/$env:GITHUB_REPOSITORY/actions/jobs/119577342135" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $job.run_id -ne 39703299290) { throw 'Source-matched Windows job could not be verified.' }
          $required = @('Unit and Excel archive tests','Verify browser bytes and packaged runtime source','Practical desktop Excel-only test with 30-product batch','Test packaged Windows EXE visible price and Excel JPEG export','Build verified small app update without Chromium or Electron','Create Windows Setup installer with uninstall support')
          foreach ($name in $required) {
            if (@($job.steps | Where-Object { $_.name -eq $name -and $_.conclusion -eq 'success' }).Count -ne 1) { throw "Completed Windows evidence is missing: $name" }
          }
          $artifacts = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/39703299290/artifacts" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($artifacts.artifacts | Where-Object { $_.name -eq 'AliExpress-Windows-Setup-Chromium-included' -and -not $_.expired -and $_.size_in_bytes -gt 1000000 }).Count -ne 1) { throw 'Completed Setup artifact could not be verified.' }
          'reuse=true' >> $env:GITHUB_OUTPUT
          'Unchanged app/runtime/browser/fixture inputs retain the completed fresh 30-product batch, 217 JPEG checks and source-matched Setup artifact from https://github.com/Awser42/Software/actions/runs/39703299290. That run completed packaging and its standalone EXE test; installed acceptance hit a 10-second fixture navigation timeout. This run repeats all unit tests and actual installation, installed source/browser verification, the complete installed export/update test with a 60-second navigation allowance, registration and uninstall acceptance.' >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/download-artifact@v4
        if: steps.previous.outputs.reuse == 'true'
        with:
          name: AliExpress-Windows-Setup-Chromium-included
          path: dist
          github-token: ${{ github.token }}
          run-id: 39703299290
      - uses: actions/download-artifact@v4
        if: steps.previous.outputs.reuse == 'true'
        with:
          name: practical-test-evidence
          path: test-results
          github-token: ${{ github.token }}
          run-id: 39703299290
      - name: Separate previous distribution results from current acceptance
        if: steps.previous.outputs.reuse == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results/previous-distribution | Out-Null
          foreach ($name in @('installer.json', 'packaged-failure.json', 'packaged-failure.png', 'packaged-stages.json', 'packaged-windows.png', 'packaged-small-update.png')) {
            $file = Join-Path test-results $name
            if (Test-Path -LiteralPath $file) { Move-Item -LiteralPath $file -Destination test-results/previous-distribution -Force }
          }
      - name: Download pinned Windows Chromium
        if: steps.previous.outputs.reuse != 'true'
        run: npm run bundle:chromium
      - name: Package Windows app with Chromium
        if: steps.previous.outputs.reuse != 'true'
        run: npm exec -- electron-builder --win --x64 --dir --publish never
      - name: Verify browser bytes and packaged runtime source
        if: steps.previous.outputs.reuse != 'true'
        run: node scripts/verify-package.js
      - name: Practical desktop Excel-only test with 30-product batch
        if: steps.previous.outputs.reuse != 'true'
        env:
          E2E_BUNDLED: '1'
        run: node test/ui.e2e.js
      - name: Test packaged Windows EXE visible price and Excel JPEG export
        if: steps.previous.outputs.reuse != 'true'
        run: node test/packaged.e2e.js
      - name: Build verified small app update without Chromium or Electron
        run: npm run build:update
      - name: Check live AliExpress product without an account
        if: steps.previous.outputs.reuse != 'true'
        continue-on-error: true
        env:
          E2E_BUNDLED: '1'
          LIVE_PRODUCT_URL: ${{ inputs.product_url || 'https://www.aliexpress.us/item/3256812932267795.html' }}
        run: node test/live-product.e2e.js
      - name: Create Windows Setup installer with uninstall support
        if: steps.previous.outputs.reuse != 'true'
        run: npm exec -- electron-builder --win nsis --x64 --prepackaged dist/win-unpacked --publish never
      - name: Verify actual install installed-app update and uninstall
        run: node test/installer.e2e.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practical-test-evidence
          path: test-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AliExpress-Windows-Setup-Chromium-included
          compression-level: 0
          path: dist/*-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: AliExpress-small-code-update
          path: |
            dist/*-Code-update.zip
            dist/update-manifest.json
  publish-download:
    needs: test-and-package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TESTED_COMMIT: ${{ github.sha }}
      TESTED_RUN: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Read package version
        run: echo "APP_VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: AliExpress-Windows-Setup-Chromium-included
          path: download
      - uses: actions/download-artifact@v4
        with:
          name: practical-test-evidence
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          name: AliExpress-small-code-update
          path: download
      - name: Review live-page evidence
        run: |
          test -s evidence/live-product.json
          jq -e '.status != "extraction-error" and .status != "error"' evidence/live-product.json
          cp evidence/live-product.json download/Live-product-check.json
      - name: Prepare tested installer ZIP and checksums
        run: |
          test -s "download/AliExpress-Product-Archiver-$APP_VERSION-Setup.exe"
          cat > download/READ-ME.txt <<TEXT
          AliExpress Product Archiver $APP_VERSION - Windows 10/11 x64
          Run AliExpress-Product-Archiver-$APP_VERSION-Setup.exe.
          Choose an installation folder. Chromium is included; no Node.js is needed.
          Quit any older portable copy from its tray before installing.
          Show Chromium / Login, sign into AliExpress, choose an output folder and Run links.
          Each product ZIP contains ONLY product.xlsx and Images/*.jpg. No CSV is generated.
          Product Details: title, URL, capture time, descriptions, features and specifications.
          Variations: observed variation name, confirmed visible price, size, color, title and image filenames.
          Missing content stays blank. Login and CAPTCHA are manual.
          Chromium runs minimized until Show Chromium is clicked. Close the app to its tray;
          use Quit in the tray menu to stop it completely.
          Settings > Check for updates downloads compatible small code updates without Chromium.
          Windows Settings > Apps > Installed apps > AliExpress Product Archiver > Uninstall removes the app.
          Settings > Uninstall software directly starts the installed Windows uninstaller and closes the app. Finish active runs first.
          Separate product exports and the saved login/settings profile are kept when uninstalling.
          Older portable copies are separate files: Quit them and delete their EXE when no longer needed.
          A small update changes a portable copy's app features but does not register an installer.
          The installer is unsigned. Account-specific live prices require your own login.
          TEXT
          cd download
          zip -0 "AliExpress-Product-Archiver-$APP_VERSION-Download.zip" "AliExpress-Product-Archiver-$APP_VERSION-Setup.exe" READ-ME.txt
          unzip -t "AliExpress-Product-Archiver-$APP_VERSION-Download.zip"
          sha256sum "AliExpress-Product-Archiver-$APP_VERSION-Setup.exe" "AliExpress-Product-Archiver-$APP_VERSION-Download.zip" "AliExpress-Product-Archiver-$APP_VERSION-Code-update.zip" update-manifest.json > SHA256SUMS.txt
      - name: Publish only after Windows export install and uninstall tests pass
        run: |
          cat > release-notes.md <<TEXT
          Delete individual download records or all app history without deleting exported ZIP files. Variation image filenames now include each observed size and its confirmed price. Chromium is included.

          Downloads has Delete record and Delete all records commands with a Cancel-first confirmation. Deleting all records clears the queue and pasted links; ZIP files, settings and browser login are preserved. Deletion is blocked until the active run finishes, including when paused. Deleted records stay deleted after restarting.

          Each variation photo filename includes its observed options and confirmed price. When two sizes share a photo but have different prices, each size gets its own named JPEG copy and its Excel row points to that copy. Shared sources are downloaded and decoded once. Missing prices stay absent; a product-level, hidden or stale price is not substituted for an unconfirmed variation price. Earlier archives can be recaptured in the new naming format without overwriting old ZIP files.

          Download and run Setup.exe. Quit an older portable copy from its tray first. The installer adds Windows shortcuts and an Installed apps entry. Remove the app through Windows Settings > Apps > Installed apps, or Settings > Uninstall software in the app. Separate exported archives and the saved login/settings profile are preserved. Old portable EXEs remain separate files and can be deleted after quitting them.

          Each product ZIP now contains only product.xlsx and Images/*.jpg; no CSV is generated. Product Details contains the observed title, URL, capture time, description, seller description, features and specifications. Variations puts each variation name next to its confirmed visible price, size, color and image filenames. Excel widths, wrapping and frozen/filterable headers are retained; long descriptions continue over readable rows. Existing archives remain available and older-format links can be recaptured.

          Chromium and the app retain background/tray controls. Settings > Check for updates can upgrade an existing 1.4.x copy using a small code ZIP without downloading Chromium again. Small code updates do not add Windows installer registration to a portable copy; use Setup for installed-app uninstall support.

          Native Windows distribution verification: https://github.com/$GH_REPO/actions/runs/$TESTED_RUN
          Tested source: $TESTED_COMMIT
          This release is published only after the Windows acceptance job succeeds. The source-matched 30-product fixture batch from https://github.com/$GH_REPO/actions/runs/39703299290 checks 31 workbooks and 217 JPEG files, including each size-specific price filename. Its completed source, browser, batch and Setup evidence is retained only after exact application inputs and authenticated successful step records are verified. The final run repeats all unit tests, actual installation, installed source/browser verification, the full installed EXE export/small-update test and unregister/uninstall acceptance. The native test appends the vendor /S option to automate uninstall confirmation; the normal app opens the standard confirmation window. Record-deletion cancellation, restart persistence and preservation of ZIP files, settings and browser profile were separately exercised through the actual source desktop app on Linux.

          Login and CAPTCHA are manual. Missing values are never invented. Fixtures do not establish your live account prices; see Live-product-check.json for the separate anonymous result. The installer is unsigned.
          TEXT
          gh release create "v$APP_VERSION" "download/AliExpress-Product-Archiver-$APP_VERSION-Setup.exe" "download/AliExpress-Product-Archiver-$APP_VERSION-Download.zip" "download/AliExpress-Product-Archiver-$APP_VERSION-Code-update.zip" download/update-manifest.json download/SHA256SUMS.txt download/Live-product-check.json --target "$TESTED_COMMIT" --title "Windows $APP_VERSION - Record deletion and size-price image filenames" --notes-file release-notes.md
