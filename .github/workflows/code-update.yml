name: Small Windows code update
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: small-code-update
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[code-update]')
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run build:icons
      - name: Reuse checksum-verified released runtime without rebuilding Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results/base-runtime | Out-Null
          $setup = Join-Path $PWD 'test-results/base-runtime/Setup-1.4.3.exe'
          Invoke-WebRequest 'https://github.com/Awser42/Software/releases/download/v1.4.3/AliExpress-Product-Archiver-1.4.3-Setup.exe' -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() -ne '8b827235b73e4e15ea1e785a0fc39339a1f5c0aa314db3e17951d699df57c720') { throw 'Released runtime checksum mismatch.' }
          7z x $setup '-otest-results/base-runtime/setup' -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract released Setup.' }
          $payload = Get-ChildItem test-results/base-runtime/setup -Recurse -Filter 'app-64.7z' | Select-Object -First 1
          if (!$payload) { throw 'Released runtime payload is missing.' }
          7z x $payload.FullName '-otest-results/base-runtime/app' -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract released app.' }
          $exe = Join-Path $PWD 'test-results/base-runtime/app/AliExpress Product Archiver.exe'
          $chrome = Get-ChildItem test-results/base-runtime/app/resources/chromium -Recurse -Filter chrome.exe | Select-Object -First 1
          if (!(Test-Path $exe) -or !$chrome) { throw 'Existing EXE or Chromium is missing.' }
          "CODE_UPDATE_BASE_EXE=$exe" >> $env:GITHUB_ENV
          "TEST_CHROMIUM=$($chrome.FullName)" >> $env:GITHUB_ENV
      - name: Unit and concurrency tests
        run: npm test
      - name: Runtime and build dependency security audit
        run: npm run audit:dependencies
      - name: Build code only without Electron or Chromium
        run: npm run build:update
      - name: Existing Windows EXE small-update and native visibility acceptance
        run: node test/code-update.e2e.js
      - name: Responsive UI search pagination and 2000-record rendering check
        run: node test/layout.e2e.js
      - name: Actual desktop 31-product batch and browser controls
        run: node test/ui.e2e.js
      - name: Downloads cancellation deletion and restart persistence
        run: node test/records.e2e.js
      - name: Failed Links automatic sorting restart copy export and isolated retry
        run: node test/failures.e2e.js
      - name: Build smaller Lite Setup without bundled Chromium
        run: npm run build:win:lite
      - name: Install launch and uninstall the actual Lite Setup
        run: node test/lite.e2e.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: small-update-evidence
          path: |
            test-results/*.json
            test-results/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: verified-small-update
          path: |
            dist/*-Code-update.zip
            dist/update-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-lite-setup
          compression-level: 0
          path: dist-lite/*-Lite-Setup.exe
  publish:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TESTED_SHA: ${{ github.sha }}
      TESTED_RUN: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-small-update
          path: download
      - uses: actions/download-artifact@v4
        with:
          name: small-update-evidence
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          name: verified-lite-setup
          path: download
      - name: Publish only the verified code update
        shell: bash
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          jq -e --arg version "$VERSION" '.status == "passed" and .nativeWindows and .version == $version and .exportFormat == "product-xlsx-jpeg-v9" and .variantIdentities and .imageMapping and .peakTabs == 3 and .distinctProductPrices and .hoopCombinations == 12 and .distinctHoopPrices and .browserSandbox and .softwareVisible and .loginPreserved and .visibilityWorker.processStarts == 1' evidence/code-update.json
          jq -e '.metadata.vulnerabilities.total == 0' evidence/dependency-audit.json
          jq -e '.status == "passed" and .benchmark.nodeReused and .benchmark.imageReused and .benchmark.previewOpen and .benchmark.mutations == 0' evidence/layout-performance.json
          jq -e '.status == "passed" and .noBundledChromium and .externalCache and .installedLaunch and .uninstalled' evidence/lite.json
          jq -e '.status == "passed" and .nativeWindows and .restartPersistence and .copyExport and .isolatedRetry and .failedRetryReturned and .downloadsClearPreservesFailuresAndExports and .confirmedRemoval and .outputFailureRecovery' evidence/failed-links.json
          cp evidence/code-update.json download/Windows-update-check.json
          cp evidence/layout-performance.json download/UI-performance-check.json
          cp evidence/lite.json download/Lite-installer-check.json
          cp evidence/failed-links.json download/Failed-links-check.json
          cp evidence/dependency-audit.json download/Dependency-audit.json
          cp COMMERCIAL-READINESS.md download/Commercial-readiness.md
          cp docs/AI-EXPORT-ROMAN-URDU.txt download/AI-EXPORT-ROMAN-URDU.txt
          cp evidence/failed-links-desktop.png download/Failed-links-desktop.png
          cp evidence/failed-links-small.png download/Failed-links-small.png
          cp evidence/redesign-1440.png download/UI-desktop-preview.png
          cp evidence/redesign-390.png download/UI-small-window-preview.png
          LITE_PERCENT=$(jq -r .smallerPercent evidence/lite.json)
          LITE_BYTES=$(jq -r .bytes evidence/lite.json)
          (cd download && sha256sum *-Code-update.zip *-Lite-Setup.exe update-manifest.json > SHA256SUMS.txt)
          cat > notes.md <<TEXT
          Each design and its own size/hoop option now keep a separate identity, visible price and matching photos.

          Update the installed software through **Settings > Check for updates > Download small update > Restart to apply**. Finish the active queue first and confirm **Version $VERSION** in the header. Chromium, settings, login and earlier ZIPs are kept. Do not extract the code ZIP over the EXE.

          Excel Variations adds Design, Size, Hoop/Pack, stable Variant ID and Design ID, full original options and confirmation status. Image Map joins filenames to the same combination, price, image role and source URLs. JPEG names include those IDs, observed options and confirmed cost. Equal prices do not merge different designs. Known photos of another design are excluded; generic photos are labelled shared references. Blank prices remain unconfirmed. A design change can reveal a different size list or clear a required selection; those real enabled controls are explored and freshly priced. Capture limits warn when additional combinations may remain.

          **Add earlier links again** to create the new v9 format. Old ZIP files are kept. Give product.xlsx and Images together to the next AI/tool; AI-EXPORT-ROMAN-URDU.txt includes a ready handoff prompt.

          This exact code ZIP passed native Windows acceptance on the released 1.4.3 EXE, including variant IDs, Image Map, different design/size prices, three tabs, browser controls and persistent login. Source desktop checks cover 31 workbooks and 372 JPEGs; separate checks cover history/failure recovery, responsive UI and actual Lite installation/startup/uninstall. Fixtures are controlled examples, not live-account price evidence. The dependency audit reports zero known advisories. The Lite browser cache is seeded for acceptance; a live first-browser download was not verified. Installers remain unsigned.

          New installations may use the optional Lite Setup: $LITE_BYTES bytes, $LITE_PERCENT percent smaller than the earlier full 1.4.3 installer. It downloads pinned Chromium on first use. Existing users should use the small update.

          Verified source: $TESTED_SHA
          Windows acceptance: https://github.com/$GH_REPO/actions/runs/$TESTED_RUN
          Full bundled base installer: https://github.com/$GH_REPO/releases/download/v1.4.3/AliExpress-Product-Archiver-1.4.3-Setup.exe
          TEXT
          gh release create "v$VERSION" download/* --target "$TESTED_SHA" --title "$VERSION - Explicit design, size and price mapping" --notes-file notes.md
