name: Live product verification without an account
on:
  workflow_dispatch:
    inputs:
      product_url:
        description: AliExpress product URL to check with a fresh Chromium profile
        required: true
        default: https://www.aliexpress.us/item/3256811699433017.html
  push:
    branches: [live-product-check]
    paths: [.github/workflows/live-product.yml]
permissions:
  contents: read
concurrency:
  group: live-product-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-live-product:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      E2E_BUNDLED: '1'
      LIVE_PRODUCT_URL: ${{ inputs.product_url || 'https://www.aliexpress.us/item/3256811699433017.html' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Download matching compact Windows Chromium
        run: npm run bundle:chromium
      - name: Check requested product using production extraction and Chromium
        run: node test/live-product.e2e.js
      - name: Save actual anonymous result for public review
        if: always()
        shell: pwsh
        env:
          AUDIT_BRANCH: ${{ github.ref_name }}
        run: |
          if (!(Test-Path 'test-results/live-product.json')) { exit 0 }
          node -e "const fs=require('node:fs');const {productKey}=require('./src/archive');const record=JSON.parse(fs.readFileSync('test-results/live-product.json','utf8'));if(record.accountSession!==false)throw new Error('Only anonymous audit results can be published');const id=productKey(record.url);if(!/^\d+$/.test(id))throw new Error('Invalid product ID');fs.mkdirSync('validation/live-products',{recursive:true});fs.writeFileSync('validation/live-products/'+id+'.json',JSON.stringify(record,null,2)+'\n');"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- validation/live-products
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m 'Record anonymous live product audit [skip ci]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin "HEAD:$env:AUDIT_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anonymous-live-product-evidence
          path: test-results/live-product.*
